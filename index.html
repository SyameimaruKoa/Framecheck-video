<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレームカウント動画</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <noscript>
        <div style="background-color: #ffe6e6; border: 1px solid #ffb3b3; padding: 10px; margin: 10px 0; font-family: sans-serif;">
            <strong>JavaScriptが無効になっています。</strong><br>
            JavaScriptが動作しないブラウザ（レガシー機器など）で動画の再生速度（FPS）を変更するには、
            サーバー側で計算を行う「<a href="/nojs">JS非対応ブラウザ向けページ</a>」をご利用ください。
        </div>
    </noscript>

    <h1>モニターの残像やすべてのフレームが正常に表示されているかを調べる動画です</h1>
    <nav>
        <ul>
            <li><a href="#v2-60fps">60fps版</a></li>
            <li><a href="#v2-24fps">24fps版</a></li>
            <li><a href="#v1">旧バージョンファイル</a></li>
            <li><a href="files.html">ファイル一覧・ダウンロード</a></li>
            <li><a href="flash_player.html?file=videos/Framecount_V2_60fps.swf">Flashエミュレータ</a></li>
            <li><a href="#notes">注意事項・ソースコード</a></li>
        </ul>
    </nav>
    <h2 id="v2-60fps">60fps版</h2>
    <video src="videos/Framecount_V2_60fps.mp4" controls loop loading="lazy" preload="metadata">
        <object type="application/x-shockwave-flash" data="videos/Framecount_V2_60fps.swf" width="480" height="270">
            <param name="movie" value="videos/Framecount_V2_60fps.swf">
            <param name="loop" value="true">
            <p>お使いのブラウザは動画の埋め込み再生に対応していません。ダウンロードしてご覧ください。</p>
        </object>
    </video>
    <button id="btn_60">60fps</button>
    <button id="btn_60_90">90fps</button>
    <button id="btn_60_120">120fps</button>
    <button id="btn_60_180">180fps</button>

    <h2 id="v2-24fps">24fps版</h2>
    <video src="videos/Framecount_V2_24fps.mp4" controls loop loading="lazy" preload="metadata">
        <object type="application/x-shockwave-flash" data="videos/Framecount_V2_24fps.swf" width="480" height="270">
            <param name="movie" value="videos/Framecount_V2_24fps.swf">
            <param name="loop" value="true">
            <p>お使いのブラウザは動画の埋め込み再生に対応していません。ダウンロードしてご覧ください。</p>
        </object>
    </video>
    <button id="btn_24">24fps</button>
    <button id="btn_24_48">48fps</button>
    <button id="btn_24_72">72fps</button>
    <button id="btn_24_96">96fps</button>
    <button id="btn_24_144">144fps</button>

    <h2 id="v1">旧バージョンファイル</h2>
    <video src="videos/frametest_v1.mp4" controls loop loading="lazy" preload="metadata"></video>

    <hr>
    <h2 id="notes">注意事項・ソースコード</h2>
    <ul>
        <li>ファイルは常識の範囲で自由に使っていいですが、二次配布のみNG</li>
        <li>ソースコード: <a href="https://github.com/SyameimaruKoa/Framecheck-video" target="_blank"
                rel="noopener noreferrer">GitHubリポジトリ</a></li>
    </ul>

    <script src="script.js"></script>
</body>

</html>
